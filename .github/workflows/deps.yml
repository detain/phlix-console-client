name: Dependencies

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up PHP
        uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60
        with:
          php-version: '8.3'
          extensions: gd, pcntl, posix
          coverage: none

      - name: Update dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run PHPStan (tests)
        run: vendor/bin/phpstan analyse -c phpstan-tests.neon --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

      - name: Commit updated lock
        run: |
          if ! git diff --quiet composer.lock; then
            git config user.name  "phlix-bot"
            git config user.email "bot@phlix.local"
            git add composer.lock
            git commit -m "chore(deps): refresh composer.lock from dev-master"
            git push origin master
          fi
