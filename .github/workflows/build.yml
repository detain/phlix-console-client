name: Build

on:
  push:
    branches: [master]
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phar:
    name: Build phlix.phar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pcntl, posix
          # box writes the phar, so phar.readonly must be off.
          ini-values: phar.readonly=0
          tools: box
          coverage: none

      - name: Install dependencies (no dev)
        run: composer install --no-dev --no-interaction --prefer-dist

      - name: Build phlix.phar
        run: box compile

      - name: Smoke-test the phar
        run: php build/phlix.phar help

      - name: Generate SHA256SUMS
        run: |
          cd build
          sha256sum phlix.phar > SHA256SUMS
          echo "SHA256SUMS contents:"
          cat SHA256SUMS

      - name: Upload phar artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phlix-phar
          path: build/phlix.phar
          if-no-files-found: error

      - name: Upload SHA256SUMS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sha256sums
          path: build/SHA256SUMS
          if-no-files-found: error

  release-latest:
    name: Update "latest" prerelease
    needs: phar
    # On every master push, overwrite a rolling "latest" GitHub Release carrying
    # the RAW phlix.phar as a directly-downloadable asset (GitHub Actions
    # artifacts are always served zipped — a Release is the only way to offer a
    # bare, runnable phar). Skipped on PRs and tag pushes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Download phar artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: phlix-phar
          path: artifacts

      - name: Download SHA256SUMS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sha256sums
          path: artifacts

      - name: Reset "latest" release + tag
        # Delete any existing rolling release + tag so the recreated one points at
        # this commit and carries only the freshly-built phar.
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify SHA256SUMS
        run: |
          cd artifacts
          sha256sum -c SHA256SUMS
          echo "SHA256SUMS verification passed."

      - name: Publish "latest" prerelease
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: latest
          name: Latest (master)
          body: |
            Rolling build of the latest `master` commit (${{ github.sha }}).
            Download the runnable phar directly — no zip:
            - **`phlix.phar`** — run with `php phlix.phar` (needs PHP 8.3+ with the
              `gd` extension; `ffmpeg` on PATH for video frames).
            Verify with SHA256SUMS.
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/phlix.phar
            artifacts/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-tag:
    name: Publish real release
    needs: phar
    # On tag push (v*.*.*), create a proper release with the version number.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download phar artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: phlix-phar
          path: artifacts

      - name: Download SHA256SUMS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sha256sums
          path: artifacts

      - name: Verify SHA256SUMS
        run: |
          cd artifacts
          sha256sum -c SHA256SUMS
          echo "SHA256SUMS verification passed."

      - name: Tag-vs-version consistency check
        run: |
          # Extract version constant from the built phar
          PHAR_VERSION=$(php -r "
            \$phar = new Phar('artifacts/phlix.phar');
            \$version = 'not-found';
            foreach (\$phar as \$file) {
              if (\$file->getFilename() === 'bin/phlix') {
                \$content = file_get_contents('phar://artifacts/phlix.phar/bin/phlix');
                if (preg_match('/PHLIX_VERSION\s*=\s*[\'\"]([^\'\"]+)[\'\"]/', \$content, \$m)) {
                  \$version = \$m[1];
                }
                break;
              }
            }
            echo \$version;
          ")
          echo "Tag version: ${{ steps.version.outputs.version }}"
          echo "Phar version: $PHAR_VERSION"
          if [ "$PHAR_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Version mismatch! Tag is ${{ steps.version.outputs.version }} but phar contains $PHAR_VERSION"
            exit 1
          fi
          echo "Tag-vs-version consistency check passed."

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Phlix ${{ steps.version.outputs.version }}
          body: |
            Phlix console client v${{ steps.version.outputs.version }}.

            Download the runnable phar directly — no zip:
            - **`phlix.phar`** — run with `php phlix.phar` (needs PHP 8.3+ with
              the `gd` extension; `ffmpeg` on PATH for video frames).

            Verify integrity with `sha256sum -c SHA256SUMS`.
          files: |
            artifacts/phlix.phar
            artifacts/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
