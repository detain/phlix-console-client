name: Build

on:
  push:
    branches: [master]
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phar:
    name: Build phlix.phar
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.3'
          extensions: gd, pcntl, posix
          # box writes the phar, so phar.readonly must be off.
          ini-values: phar.readonly=0
          tools: box
          coverage: none

      - name: Install dependencies (no dev)
        run: composer install --no-dev --no-interaction --prefer-dist

      - name: Build phlix.phar
        run: box compile

      - name: Assert the phar carries a real commit stamp
        # [CON-S34] box's git-commit-placeholder must have baked the compiled
        # commit over PHLIX_COMMIT; a phar that still says "dev" cannot be
        # traced to the commit it was built from.
        run: |
          set -euo pipefail
          OUT=$(php build/phlix.phar version)
          echo "$OUT"
          if ! echo "$OUT" | grep -Eq '\(commit [0-9a-f]{7,40}\)'; then
            echo "::error::phlix.phar version has no hex commit stamp (got: $OUT) - git-commit-placeholder did not run"
            exit 1
          fi

      - name: Smoke-test the phar
        run: |
          php build/phlix.phar --version
          php build/phlix.phar bogus || test $? -eq 2
          # The selftest requires a reachable server on 127.0.0.1:8099.
          # Start the stub server in this same step — background processes are
          # terminated when a GitHub Actions step ends.
          php -S 127.0.0.1:8099 tests/stub/router.php &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if nc -z 127.0.0.1 8099; then break; fi
            sleep 0.2
          done
          PHLIX_SERVER_URL=http://127.0.0.1:8099 php build/phlix.phar run --selftest

      - name: Assert reproducible phar build
        # [stable-PHAR] The phar must be a pure function of the tree: compile a
        # second time and require the same sha256. The historical wobble was
        # box's random stub alias (pinned away by box.json's "alias" key); a
        # rebuild that changes bytes is a supply-chain regression — convict.
        run: |
          set -euo pipefail
          BEFORE=$(sha256sum build/phlix.phar | awk '{print $1}')
          box compile
          AFTER=$(sha256sum build/phlix.phar | awk '{print $1}')
          echo "build #1 sha256: $BEFORE"
          echo "build #2 sha256: $AFTER"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "::error::phar build is not reproducible — consecutive box compile runs disagree"
            exit 1
          fi
          echo "Reproducible: the phar passed the x2 byte-identity rebuild gate."

      - name: Generate SHA256SUMS
        run: |
          cd build
          sha256sum phlix.phar > SHA256SUMS
          echo "SHA256SUMS contents:"
          cat SHA256SUMS

      - name: Upload phar artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: phlix-phar
          path: build/phlix.phar
          if-no-files-found: error

      - name: Upload SHA256SUMS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sha256sums
          path: build/SHA256SUMS
          if-no-files-found: error

  release-latest:
    name: Update "latest" prerelease
    needs: phar
    # On every master push, overwrite a rolling "latest" GitHub Release carrying
    # the RAW phlix.phar as a directly-downloadable asset (GitHub Actions
    # artifacts are always served zipped — a Release is the only way to offer a
    # bare, runnable phar). Skipped on PRs and tag pushes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download phar artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: phlix-phar
          path: artifacts

      - name: Download SHA256SUMS artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sha256sums
          path: artifacts

      - name: Reset "latest" release + tag
        # Delete any existing rolling release + tag so the recreated one points at
        # this commit and carries only the freshly-built phar.
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify SHA256SUMS
        run: |
          cd artifacts
          sha256sum -c SHA256SUMS
          echo "SHA256SUMS verification passed."

      - name: Publish "latest" prerelease
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          tag_name: latest
          name: Latest (master)
          body: |
            Rolling build of the latest `master` commit (${{ github.sha }}).
            Download the runnable phar directly — no zip:
            - **`phlix.phar`** — run with `php phlix.phar` (needs PHP 8.3+ with the
              `ext-gd`, `ext-mbstring`, `ext-intl`, `ext-ffi` and `ext-json`
              extensions, plus `ext-curl` for `doctor`, `run --selftest` and
              `watch`'s relay-token mint; `ext-pcntl` is composer-enforced (soft only in PHAR): without it no exit-signal teardown or Ctrl-Z suspend;
              `ffmpeg` on PATH for video frames).
            Verify with SHA256SUMS.
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/phlix.phar
            artifacts/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-tag:
    name: Publish real release
    needs: phar
    # On tag push (v*.*.*), create a proper release with the version number.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download phar artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: phlix-phar
          path: artifacts

      - name: Download SHA256SUMS artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sha256sums
          path: artifacts

      - name: Verify SHA256SUMS
        run: |
          cd artifacts
          sha256sum -c SHA256SUMS
          echo "SHA256SUMS verification passed."

      - name: Tag-vs-version consistency check
        run: |
          # Extract version constant from the built phar
          PHAR_VERSION=$(php -r "
            \$phar = new Phar('artifacts/phlix.phar');
            \$version = 'not-found';
            foreach (\$phar as \$file) {
              if (\$file->getFilename() === 'bin/phlix') {
                \$content = file_get_contents('phar://artifacts/phlix.phar/bin/phlix');
                if (preg_match('/PHLIX_VERSION\s*=\s*[\'\"]([^\'\"]+)[\'\"]/', \$content, \$m)) {
                  \$version = \$m[1];
                }
                break;
              }
            }
            echo \$version;
          ")
          echo "Tag version: ${{ steps.version.outputs.version }}"
          echo "Phar version: $PHAR_VERSION"
          if [ "$PHAR_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Version mismatch! Tag is ${{ steps.version.outputs.version }} but phar contains $PHAR_VERSION"
            exit 1
          fi
          echo "Tag-vs-version consistency check passed."

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Phlix ${{ steps.version.outputs.version }}
          body: |
            Phlix console client v${{ steps.version.outputs.version }}.

            Download the runnable phar directly — no zip:
            - **`phlix.phar`** — run with `php phlix.phar` (needs PHP 8.3+ with
              the `ext-gd`, `ext-mbstring`, `ext-intl`, `ext-ffi` and
              `ext-json` extensions, plus `ext-curl` for `doctor`,
              `run --selftest` and `watch`'s relay-token mint; `ext-pcntl` is composer-enforced (soft only in PHAR): without it no exit-signal teardown or Ctrl-Z suspend; `ffmpeg` on PATH for video frames).

            Verify integrity with `sha256sum -c SHA256SUMS`.
          files: |
            artifacts/phlix.phar
            artifacts/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
