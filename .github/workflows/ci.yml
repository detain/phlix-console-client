name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: gd, pcntl, posix
          coverage: pcov

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  phpstan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: gd, pcntl, posix
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  phpcs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Assert PHPCS is actually installed
        run: |
          if [ ! -f vendor/bin/phpcs ]; then
            echo "::error::vendor/bin/phpcs is missing. squizlabs/php_codesniffer must stay in composer.json require-dev."
            exit 1
          fi
          ./vendor/bin/phpcs --version

      - name: Run PHPCS on src/
        run: |
          # Capture output and exit code
          output=$(./vendor/bin/phpcs --standard=PSR12 --colors src/ 2>&1) || true
          echo "$output"
          # Parse A TOTAL OF n ERRORS
          if echo "$output" | grep -qE "A TOTAL OF [0-9]+ ERROR"; then
            error_line=$(echo "$output" | grep -E "A TOTAL OF [0-9]+ ERROR" | head -1)
            echo "::error::$error_line"
            exit 1
          fi

      - name: Run PHPCS on tests/
        run: |
          output=$(./vendor/bin/phpcs --standard=PSR12 --colors tests/ 2>&1) || true
          echo "$output"
          if echo "$output" | grep -qE "A TOTAL OF [0-9]+ ERROR"; then
            error_line=$(echo "$output" | grep -E "A TOTAL OF [0-9]+ ERROR" | head -1)
            echo "::error::$error_line"
            exit 1
          fi

  vendor-patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check for hand-patched vendor files
        run: |
          # Fail if any vendor PHP file contains patterns indicating hand-patching.
          # These patterns should never appear in a clean composer install.
          PATCHED=$(grep -rEl '(ORIGINAL|FIXED-BY|PATCH{|// PATCH|/\* PATCH|\x1b\[1;31mPATCH)' vendor/ --include='*.php' 2>/dev/null || true)
          if [ -n "$PATCHED" ]; then
            echo "::error::Found hand-patched vendor files:"
            echo "$PATCHED"
            echo ""
            echo "Do not hand-patch vendor files. Fork the package and use composer repositories."
            exit 1
          fi
          echo "No hand-patched vendor files found."

  smoke:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: gd, pcntl, posix
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Start stub HTTP server
        run: php -S 127.0.0.1:8099 tests/stub/router.php &
        working-directory: ${{ github.workspace }}

      - name: Wait for port 8099
        run: bash -c 'until nc -z 127.0.0.1 8099; do sleep 0.2; done' || bash -c 'timeout 20 bash -c "until nc -z 127.0.0.1 8099; do sleep 0.2; done" || exit 1"'

      - name: Run selftest
        run: PHLIX_SERVER_URL=http://127.0.0.1:8099 php bin/phlix run --selftest
        working-directory: ${{ github.workspace }}
