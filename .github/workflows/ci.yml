name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pcntl, posix
          coverage: pcov

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: vendor/bin/phpunit

      # phpunit.xml.dist declares <report><cobertura outputFile="coverage.xml"/>,
      # and setup-php provides pcov above, so ./coverage.xml is written by the
      # run itself - no extra --coverage flag is needed. This job has no PHP
      # matrix, so there is exactly one upload per run and no `if:` gate.
      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@v1
        # Never allowed to fail the build: a missing/expired token or a Codacy
        # outage must not turn CI red.
        continue-on-error: true
        with:
          api-token: ${{ secrets.CODACY_API_TOKEN }}
          coverage-reports: ./coverage.xml

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pcntl, posix
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress
