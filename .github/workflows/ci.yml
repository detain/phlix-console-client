name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: gd, pcntl, posix
          coverage: pcov

      - name: Install ffmpeg and libsixel-bin
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsixel-bin
        # libsixel-bin provides sixel2png which is required by sugar-reel's
        # GraphicsRenderer for SIXEL protocol encoding in tests. Without it
        # the GraphicsRenderer output is empty and tests skip gracefully.

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  phpstan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: gd, pcntl, posix
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run PHPStan (tests)
        run: vendor/bin/phpstan analyse -c phpstan-tests.neon --no-progress

  phpcs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Assert PHPCS is actually installed
        run: |
          if [ ! -f vendor/bin/phpcs ]; then
            echo "::error::vendor/bin/phpcs is missing. squizlabs/php_codesniffer must stay in composer.json require-dev."
            exit 1
          fi
          ./vendor/bin/phpcs --version

      - name: Run PHPCS on src/
        # THE GATE IS phpcs's NONZERO EXIT CODE, read directly by the runner.
        # phpcs 4.x exit codes are a BITMASK (1 = fixable issues, 2 = non-fixable
        # issues, 3 = both — vendor Util/ExitCode.php), so the number is not the
        # signal; nonzero-vs-zero is. With the ruleset's ignore_warnings_on_exit
        # policy below, only ERRORS can make it nonzero. Do NOT judge this step
        # by grepping the log for a "A TOTAL OF n ERRORS" line: that line exists
        # ONLY in phpcs's `summary` report, which this invocation never requests
        # — the `full` report prints "FOUND n ERRORS AFFECTING m LINES" instead.
        # A "repair" that adds such a grep (typically wrapped in `|| true`) is
        # the known dead-gate pattern: it disabled exactly these steps until
        # 2026-10-02 — the grep could never fire and `|| true` swallowed the
        # exit code, leaving the step structurally green while hiding a
        # 522-error/239-warning src backlog (same defect class as phlix-server
        # S146; proven with a planted violation: old expression stayed green on
        # "FOUND 3 ERRORS", this one exits nonzero).
        # Warnings stay PRINTED and non-blocking via ignore_warnings_on_exit
        # INSIDE phpcs.xml (236 Generic.Files.LineLength; see its description).
        # Do NOT add `-n` and do NOT add `|| true`: `-n` deletes the warnings
        # from the report, `|| true` re-arms the corpse this repair buried.
        run: ./vendor/bin/phpcs --standard=phpcs.xml --colors src/

      - name: Run PHPCS on tests/
        # Same live-gate law as the step above: nonzero exit code is the gate,
        # never a grep of report prose ("A TOTAL OF" is summary-only — the
        # exact defect class of the pre-2026-10-02 steps; same pattern as
        # phlix-server's S146).
        # The standard is phpcs-tests.xml, NOT bare PSR12 — read that file's
        # <description> for the measurement (25 errors / 460 warnings) and for
        # why exactly one sniff is excluded. src/ keeps zero exclusions.
        run: ./vendor/bin/phpcs --standard=phpcs-tests.xml --colors tests/

  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Run i18n guards
        run: php scripts/check-i18n-hardcoded.php && php scripts/check-i18n-catalogs.php

  vendor-patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check for hand-patched vendor files
        run: |
          # Fail if any vendor PHP file contains patterns indicating hand-patching.
          # These patterns should never appear in a clean composer install.
          # Note: do NOT match bare "ORIGINAL" — packages legitimately contain
          # constants/comments such as COMPOSER_ORIGINAL_INIS or ORIGINAL_NODE.
          PATCHED=$(grep -rEl '(FIXED-BY|PATCH{|// PATCH|/\* PATCH|\x1b\[1;31mPATCH)' vendor/ --include='*.php' 2>/dev/null || true)
          if [ -n "$PATCHED" ]; then
            echo "::error::Found hand-patched vendor files:"
            echo "$PATCHED"
            echo ""
            echo "Do not hand-patch vendor files. Fork the package and use composer repositories."
            exit 1
          fi
          echo "No hand-patched vendor files found."

  smoke:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: gd, pcntl, posix
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run selftest
        run: |
          # The selftest requires a reachable server on 127.0.0.1:8099.
          # Start the stub server in this same step — background processes are
          # terminated when a GitHub Actions step ends.
          php -S 127.0.0.1:8099 tests/stub/router.php &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if nc -z 127.0.0.1 8099; then break; fi
            sleep 0.2
          done
          PHLIX_SERVER_URL=http://127.0.0.1:8099 php bin/phlix run --selftest
        working-directory: ${{ github.workspace }}
