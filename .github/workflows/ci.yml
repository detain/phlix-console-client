name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pcntl, posix
          coverage: pcov

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

      # phpunit.xml.dist declares <report><cobertura outputFile="coverage.xml"/>,
      # and setup-php provides pcov above, so ./coverage.xml is written by the
      # run itself - no extra --coverage flag is needed. This job has no PHP
      # matrix, so there is exactly one upload per run and no `if:` gate.
      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699
        # Never allowed to fail the build: a missing/expired token or a Codacy
        # outage must not turn CI red.
        continue-on-error: true
        with:
          api-token: ${{ secrets.CODACY_API_TOKEN }}
          coverage-reports: ./coverage.xml

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pcntl, posix
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pcntl, posix
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Start stub HTTP server
        run: php -S 127.0.0.1:8099 tests/stub/router.php &
        working-directory: /home/sites/phlix/phlix-console-client

      - name: Wait for port 8099
        run: bash -c 'until nc -z 127.0.0.1 8099; do sleep 0.2; done' || bash -c 'timeout 20 bash -c "until nc -z 127.0.0.1 8099; do sleep 0.2; done" || exit 1"'

      - name: Run selftest
        run: PHLIX_SERVER_URL=http://127.0.0.1:8099 php bin/phlix run --selftest
        working-directory: /home/sites/phlix/phlix-console-client
